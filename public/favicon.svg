<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#191A19" />
  <!-- Flute body. -->
  <rect x="7" y="28" width="50" height="8" fill="#3A3C3A" />
  <!-- Tone holes: two closed, one open — a fingering at a glance. -->
  <circle cx="20" cy="32" r="5" fill="#4E9F3D" />
  <circle cx="33" cy="32" r="5" fill="#4E9F3D" />
  <circle cx="46" cy="32" r="5" fill="#191A19" stroke="#D8E9A8" stroke-width="1.6" />
  <!-- Embouchure hole. -->
  <ellipse cx="11" cy="32" rx="2.1" ry="3" fill="#101110" />
</svg>
